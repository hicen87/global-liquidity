name: 更新美元流动性管道(周频)

on:
  schedule:
    - cron: '0 12 * * 6'      # 每周六 12:00 UTC (覆盖周五收盘的FRED周频数据)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: global-liquidity-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pandas pandas_datareader akshare
      - name: 生成 data_weekly.js
        run: python build_weekly.py
      - name: 校验政府债字段并重建 standalone
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          text = Path('data_weekly.js').read_text(encoding='utf-8')
          data = json.loads(text.split('=', 1)[1].rstrip().rstrip(';'))
          latest = data.get('latest', {})
          required = ('gov4w', 'gov_ratio', 'gov_week')
          missing = [key for key in required if latest.get(key) is None]
          if missing or not data.get('gov_issue') or data.get('signals', {}).get('gov') not in {'bull', 'warn', 'bear'}:
              raise SystemExit(f'政府债数据不完整，保留线上旧文件，不提交: {missing}')
          PY
          python build_standalone.py
      - name: 提交回写
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data_weekly.js index_standalone.html
          git diff --cached --check
          git diff --staged --quiet || git commit -m "chore: 自动更新美元流动性管道(周频) $(date -u +%Y-%m-%d)"
          git push
